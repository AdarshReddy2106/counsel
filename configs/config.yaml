# ==============================================================================
# COUNSEL MLOps Central Configuration
# Managed by Member 1 (Environment, Feature Store & Data Contracts)
#
# NOTE: All string literals below are explicitly quoted to solve the YAML 1.1
# "Norway Problem" (where unquoted NO, off, on, yes parse as booleans).
# ==============================================================================

project:
  name: "counsel-mlops"
  version: "1.0.0"
  schema_version: "1.0.0"
  datacenter_country_code: "NO"   # Quoted to prevent boolean False conversion
  emergency_fallback_mode: "off"  # Quoted to prevent boolean False conversion
  experiment_name: "std"

environment:
  mode: "synthetic"
  nconf: 5                        # 5 scaling configurations per component
  ncomp: 3                        # 3 microservices: Firewall, WebServer, Database
  components:
    - "Firewall"
    - "WebServer"
    - "Database"
  flavors:
    - "none"                      # Action 0: Do nothing / retain state
    - "2"                         # Action 1: Flavor 2 instance
    - "5"                         # Action 2: Flavor 5 instance
    - "10"                        # Action 3: Flavor 10 instance
    - "13"                        # Action 4: Flavor 13 instance
    - "19"                        # Action 5: Flavor 19 instance
  budget:
    - 2500                        # CPU capacity budget limit
    - 3600                        # RAM capacity budget limit (MB)
  slo_latency_ms: 150.0           # Production SLO latency threshold
  train_slo_latency_ms: 200.0
  overrun_lim: 0.20
  knob: 0.05
  steps_per_epoch: 1000
  load_server_host: "127.0.0.1"
  load_server_port: 8000


policy:
  active_policy: "ppo"
  available_policies:
    - "ppo"
    - "heuristic"
    - "random_forest"
    - "decision_transformer"
    - "patchtst"
  ppo_model_dir: "data/std-f5-c3"
  ppo_checkpoint: "last"
  eval_seed: 42

feature_store:
  offline_parquet_path: "data/feature_store/offline_store.parquet"
  metadata_json_path: "data/feature_store/metadata.json"
  infer_log_dir: "infer_logs/feature_store_run"
  num_episodes: 20
  seed: 42
  step_interval_seconds: 5

serving:
  host: "0.0.0.0"
  port: 8080
  cache_enabled: "yes"
  cache_maxsize: 512

monitoring:
  slo_target_ratio: 0.99
  psi_bins: 10
  psi_moderate_threshold: 0.10
  psi_significant_threshold: 0.25
  release_gate_min_reward: 350.0
  release_gate_max_budget_overruns: 0
